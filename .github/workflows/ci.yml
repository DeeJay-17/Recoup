name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: recoup, POSTGRES_PASSWORD: recoup, POSTGRES_DB: recoup }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recoup" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://recoup:recoup@localhost:5432/recoup
      LLM_PROVIDER: heuristic
      DATABASE_URL: postgresql+asyncpg://recoup:recoup@localhost:5432/recoup
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --all-packages
      - name: lint
        run: |      
          uv run ruff check .
          uv run ruff format --check .
      - name: typecheck
        run: |
          for p in libs/recoup-common libs/recoup-erp-adapter services/iam services/mock-erp services/case services/gateway services/policy services/communication services/tool-gateway services/orchestrator services/realtime libs/recoup-llm; do
            (cd $p && uv run --project ../.. mypy .) || exit 1
          done
      - name: migrations apply cleanly
        run: |
          for s in iam mock-erp case policy communication tool-gateway orchestrator; do (cd services/$s && uv run --project ../.. alembic upgrade head) || exit 1; done
      - name: tests (unit + integration)
        run: |
          for p in libs/recoup-common libs/recoup-erp-adapter services/iam services/mock-erp services/case services/gateway services/policy services/communication services/tool-gateway services/orchestrator services/realtime libs/recoup-llm; do
            (cd $p && uv run --project ../.. pytest -q --rootdir=. -p no:cacheprovider) || exit 1
          done

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  images:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build images (no push yet)
        run: docker compose build iam mock-erp case gateway policy communication tool-gateway orchestrator realtime frontend

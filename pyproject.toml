[project]
name = "recoup"
version = "0.1.0"
description = "Recoup — autonomous accounts receivable & dispute resolution agent platform (monorepo root)"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
recoup-common = { workspace = true }
recoup-erp-adapter = { workspace = true }
recoup-llm = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "asgi-lifespan>=2.1",
  "recoup-common",
  "recoup-erp-adapter",
  "recoup-llm",
  "recoup-iam",
  "recoup-mock-erp",
  "recoup-case",
  "recoup-gateway",
  "recoup-policy",
  "recoup-communication",
  "recoup-tool-gateway",
  "recoup-orchestrator",
  "recoup-realtime",
  "recoup-knowledge",
  "recoup-evals",
  "recoup-analytics",
]

[tool.uv.sources.recoup-iam]
workspace = true
[tool.uv.sources.recoup-mock-erp]
workspace = true
[tool.uv.sources.recoup-case]
workspace = true
[tool.uv.sources.recoup-gateway]
workspace = true
[tool.uv.sources.recoup-policy]
workspace = true
[tool.uv.sources.recoup-communication]
workspace = true
[tool.uv.sources.recoup-tool-gateway]
workspace = true
[tool.uv.sources.recoup-orchestrator]
workspace = true
[tool.uv.sources.recoup-realtime]
workspace = true
[tool.uv.sources.recoup-knowledge]
workspace = true
[tool.uv.sources.recoup-evals]
workspace = true
[tool.uv.sources.recoup-analytics]
workspace = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.per-file-ignores]
"services/tool-gateway/recoup_tool_gateway/tools/*.py" = ["E501"]
"services/tool-gateway/tests/*.py" = ["E501"]
"services/orchestrator/recoup_orchestrator/agents/*.py" = ["E501"]
"services/orchestrator/tests/*.py" = ["E501"]
"scripts/simulate_customer.py" = ["E501"]
"services/knowledge/**/*.py" = ["E501"]
"services/evals/**/*.py" = ["E501"]
"services/analytics/**/*.py" = ["E501"]
"scripts/eval.py" = ["E501"]
"scripts/loadtest.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["RUF012", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["alembic/", "node_modules/", "frontend/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL"]
filterwarnings = ["ignore::DeprecationWarning"]

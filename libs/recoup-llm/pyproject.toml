[project]
name = "recoup-llm"
version = "0.1.0"
description = "Provider-agnostic LLM client for Recoup: Gemini, OpenAI-compatible, Anthropic, or a deterministic heuristic"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langchain-core>=0.3",
  "langchain>=0.3",
  "langchain-google-genai>=2.0",
  "langchain-openai>=0.3",
  "langchain-anthropic>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recoup_llm"]

{{- $root := . }}
{{- if .Values.autoscaling.enabled }}
{{- range $name := .Values.autoscaling.services }}
{{- if not (hasKey $root.Values.services $name) }}
{{- fail (printf "autoscaling.services names %q, which is not in .Values.services" $name) }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "recoup.fullname" $root }}-{{ $name }}
  labels:
    {{- include "recoup.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "recoup.fullname" $root }}-{{ $name }}
  minReplicas: {{ $root.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $root.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}

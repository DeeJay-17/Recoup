{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recoup.fullname" . }}-secrets
  labels: {{- include "recoup.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
{{- end }}

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "recoup.fullname" . }}
  labels: {{- include "recoup.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Only the gateway and the console are reachable from outside: every other service,
          # and every /internal route, stays on the cluster network.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "recoup.fullname" . }}-gateway
                port: { name: http }
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "recoup.fullname" . }}-realtime
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "recoup.fullname" . }}-frontend
                port: { name: http }
{{- end }}

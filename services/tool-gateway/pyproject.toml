[project]
name = "recoup-tool-gateway"
version = "0.1.0"
description = "Recoup Tool Gateway: the only path from agents to side effects"
requires-python = ">=3.12"
dependencies = [
  "recoup-common",
  "recoup-erp-adapter",
  "uvicorn[standard]>=0.30",
  "redis>=5.0",
  "email-validator>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recoup_tool_gateway"]

[project]
name = "recoup-knowledge"
version = "0.1.0"
description = "Recoup Knowledge service: hybrid retrieval over contracts, SOPs, emails and resolutions; customer memory"
requires-python = ">=3.12"
dependencies = [
  "recoup-common",
  "recoup-llm",
  "recoup-erp-adapter",
  "uvicorn[standard]>=0.30",
  "pgvector>=0.3",
  "pdfplumber>=0.11",
  "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recoup_knowledge"]

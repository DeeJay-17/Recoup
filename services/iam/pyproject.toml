[project]
name = "recoup-iam"
version = "0.1.0"
description = "Recoup Identity & Tenant service"
requires-python = ">=3.12"
dependencies = [
  "recoup-common",
  "uvicorn[standard]>=0.30",
  "pwdlib[argon2]>=0.2",
  "email-validator>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recoup_iam"]

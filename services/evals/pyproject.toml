[project]
name = "recoup-evals"
version = "0.1.0"
description = "Recoup Eval service: golden datasets, shadow replay, deterministic + LLM-judged scoring, red-team suite"
requires-python = ">=3.12"
dependencies = [
  "recoup-common",
  "recoup-llm",
  "recoup-erp-adapter",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recoup_evals"]

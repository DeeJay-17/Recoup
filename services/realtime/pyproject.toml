[project]
name = "recoup-realtime"
version = "0.1.0"
description = "Recoup Realtime: Kafka -> WebSocket fan-out to the console, scoped by tenant"
requires-python = ">=3.12"
dependencies = ["recoup-common", "uvicorn[standard]>=0.30", "websockets>=12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recoup_realtime"]

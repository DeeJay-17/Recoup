[project]
name = "recoup-communication"
version = "0.1.0"
description = "Recoup Communication service: outbound/inbound email, threading, templates"
requires-python = ">=3.12"
dependencies = [
  "recoup-common",
  "uvicorn[standard]>=0.30",
  "aiosmtplib>=3.0",
  "jinja2>=3.1",
  "pdfplumber>=0.11",
  "email-validator>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recoup_communication"]

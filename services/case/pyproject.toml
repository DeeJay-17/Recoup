[project]
name = "recoup-case"
version = "0.1.0"
description = "Recoup Case service: case state machine, timeline, proposed actions, ingestion"
requires-python = ">=3.12"
dependencies = [
  "recoup-common",
  "recoup-erp-adapter",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recoup_case"]

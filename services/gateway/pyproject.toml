[project]
name = "recoup-gateway"
version = "0.1.0"
description = "Recoup API Gateway: auth, routing, BFF aggregation"
requires-python = ">=3.12"
dependencies = ["recoup-common", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recoup_gateway"]

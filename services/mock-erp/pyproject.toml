[project]
name = "recoup-mock-erp"
version = "0.1.0"
description = "Recoup Mock ERP: realistic AR data + scripted dispute scenarios"
requires-python = ">=3.12"
dependencies = [
  "recoup-common",
  "recoup-erp-adapter",
  "uvicorn[standard]>=0.30",
  "faker>=25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recoup_mock_erp"]
